// 共用設定在根目錄 build.gradle；這裡只放本模組額外的設定。

// 自動化遊戲內測試：./gradlew :mods:logistics:runClientGameTest
// 截圖存到 build/run/clientGameTest/screenshots。
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'logistics-test'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// 煉金背包只在編譯時可見；執行時由 LogisticsMod.ALCHEMY 判斷有沒有安裝，沒裝時 AlchemyLink 不會被載入。
evaluationDependsOn(':mods:alchemy-backpack')
dependencies {
	compileOnly rootProject.project(':mods:alchemy-backpack').sourceSets.main.output
	clientCompileOnly rootProject.project(':mods:alchemy-backpack').sourceSets.main.output
	clientCompileOnly rootProject.project(':mods:alchemy-backpack').sourceSets.client.output
}
