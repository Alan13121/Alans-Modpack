// 共用設定在根目錄 build.gradle；這裡只放本模組額外的設定。

// 自動化遊戲內測試：./gradlew :mods:shapeshift:runClientGameTest
// 會開啟真的遊戲視窗、建立世界、操作變身，截圖存到 build/run/clientGameTest/screenshots。
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'shapeshift-test'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
