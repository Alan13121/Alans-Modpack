pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'modpack'

// 自動納入 mods/ 底下每個含 build 設定的模組；新增模組不需改這裡。
file('mods').eachDir { dir ->
	if (new File(dir, 'gradle.properties').exists()) {
		include ":mods:${dir.name}"
	}
}
include ':pack'
