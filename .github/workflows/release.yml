name: Release

# 推送 v* 標籤（例如 v0.1.0）時自動建置，並把 .mrpack 與各模組 jar 上傳到 GitHub Releases。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build :pack:mrpack :pack:packMods

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp pack/build/distributions/*.mrpack dist/
          cp pack/build/pack-mods/*.jar dist/

      - uses: actions/upload-artifact@v4
        with:
          name: modpack
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
